# Air configuration for hot reload
# https://github.com/cosmtrek/air

# Working directory
root = "."
tmp_dir = "tmp"

[build]
# Binary file name
bin = "./tmp/main"
# Build command
cmd = "go build -buildvcs=false -tags dev -o ./tmp/main ."
# Watch these file extensions
include_ext = ["go", "tpl", "tmpl", "html", "env"]
# Ignore these directories
exclude_dir = ["assets", "tmp", "vendor", "node_modules", "dashboard", "data"]
# Ignore these files
exclude_file = []
# Watch these directories
include_dir = []
# Exclude unchanged files
exclude_unchanged = true
# Follow symlinks
follow_symlink = true
# Log build time
log = "build-errors.log"
# Stop on error
stop_on_error = true
# Send interrupt signal before killing
kill_delay = "0s"

[color]
# Customize colors
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
# Show log time
time = true
# Only show main log
main_only = false

[misc]
# Delete tmp directory on exit
clean_on_exit = true
# Print keyboard shortcuts
in_the_place = true

[screen]
clear_on_rebuild = true
keep_scroll = true
