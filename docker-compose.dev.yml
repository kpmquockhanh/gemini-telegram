# Development Docker Compose
version: '3.8'

services:
  # Go API with hot reload
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # Mount source code for hot reload
      - ./:/app
      # Exclude node_modules and build artifacts
      - /app/node_modules
      - /app/dashboard/node_modules
      - /app/dashboard/dist
      # Data volume for SQLite
      - ./data:/app/data
    environment:
      - ENV=development
      - DEBUG=true
    command: air -c .air.toml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dev-network

  # Vue dashboard development server
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:5173"
    env_file:
      - .env
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/dashboard/node_modules
      - /app/dashboard/dist
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000
    working_dir: /app/dashboard
    command: npm run dev -- --host 0.0.0.0
    networks:
      - dev-network
    depends_on:
      - api

  # SQLite database viewer (optional - useful for development)
  # sqlite-web:
  #   image: coleifer/sqlite-web
  #   ports:
  #     - "8081:8080"
  #   volumes:
  #     - ./data:/data
  #   environment:
  #     - SQLITE_DATABASE=/data/bot.db
  #   networks:
  #     - dev-network

networks:
  dev-network:
    driver: bridge
